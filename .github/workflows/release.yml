# Builds the Linux installers (.deb, .rpm, AppImage) and attaches them to a
# draft pre-release. Push a tag such as v0.0.2, or run it by hand; the release
# stays a draft until it is published on GitHub.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev protobuf-compiler build-essential cmake clang

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            signal-sidecar -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Omega Zap v__VERSION__
          releaseDraft: true
          prerelease: true
          releaseBody: |
            A test version. Expect bugs, missing features and changes that may need you to link your accounts again.
            Omega Zap is an unofficial client, not affiliated with WhatsApp/Meta or Signal; using unofficial clients may put your accounts at risk.

            Linux only for now: `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE) or the `.AppImage` (any distribution).
            See the README for how to install and how to report a problem.
