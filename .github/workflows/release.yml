# Releases a new version when a push to main bumps the version in
# package.json: builds the Linux installers (.deb, .rpm, AppImage) into a draft,
# then publishes it, tagged v<version>. A version that already has a tag is
# skipped, so other changes to package.json release nothing. It can also be
# run by hand.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    if: needs.version.outputs.new == 'true'
    # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The GStreamer plugins go into the AppImage, so videos and voice
      # messages play on any distribution.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf \
            libssl-dev libdbus-1-dev build-essential cmake clang \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      # Ubuntu's protoc is too old for the proto3 optional fields in the
      # Signal protocol files.
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
            signal-sidecar -> target

      - run: pnpm install --frozen-lockfile

      # A draft first, so a release never shows up without its installers.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built into the app for GIF search; without it the app has no search.
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Omega Zap ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          releaseBody: |
            Linux only for now: `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE) or the `.AppImage` (any distribution). See the README for how to install and how to report a problem.

            Omega Zap is in an early stage: expect bugs, and changes that may need you to link your accounts again. It is an unofficial client, not affiliated with WhatsApp/Meta or Signal; using unofficial clients may put your accounts at risk.

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --latest
